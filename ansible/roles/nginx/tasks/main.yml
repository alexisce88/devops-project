---
# nginx/tasks/main.yml — Install Nginx and deploy config

- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy Nginx config
  template:
    src: "{{ nginx_config_template }}"
    dest: /etc/nginx/conf.d/app.conf
    mode: '0644'
  notify: reload nginx

- name: Enable and start Nginx
  systemd:
    name: nginx
    enabled: yes
    state: started
