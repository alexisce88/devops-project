---
# app/tasks/main.yml — Deploy application containers via docker-compose

- name: Create app directory
  file:
    path: /opt/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/app/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Log in to GHCR
  docker_login:
    registry: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"

- name: Pull and start containers
  community.docker.docker_compose_v2:
    project_src: /opt/app
    project_name: "{{ target_slot | default('staging') }}"
    pull: always
    state: present
