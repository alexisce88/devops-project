---
# jenkins/tasks/main.yml — Install Jenkins + Ansible + configure via JCasC

- name: Install Java 17
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: yes

# Jenkins repo is signed by key 7198F4B714ABFC68 — fetch from keyserver
- name: Add Jenkins GPG key from keyserver
  shell: |
    gpg --no-default-keyring \
      --keyring /usr/share/keyrings/jenkins-keyring.gpg \
      --keyserver keyserver.ubuntu.com \
      --recv-keys 7198F4B714ABFC68
  args:
    creates: /usr/share/keyrings/jenkins-keyring.gpg

- name: Add Jenkins repository
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/" \
      > /etc/apt/sources.list.d/jenkins.list
  args:
    creates: /etc/apt/sources.list.d/jenkins.list

- name: Update apt cache after adding Jenkins repo
  apt:
    update_cache: yes

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Install Ansible
  apt:
    name:
      - ansible
      - ansible-lint
      - sshpass
    state: present

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Create Jenkins JCasC directory
  file:
    path: /var/lib/jenkins/casc_configs
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Deploy JCasC configuration
  template:
    src: jenkins.yaml.j2
    dest: /var/lib/jenkins/casc_configs/jenkins.yaml
    owner: jenkins
    group: jenkins
    mode: '0644'

- name: Set CASC_JENKINS_CONFIG environment variable
  lineinfile:
    path: /etc/default/jenkins
    line: 'CASC_JENKINS_CONFIG=/var/lib/jenkins/casc_configs'
    create: yes

- name: Create blue/green state file (default to blue)
  copy:
    dest: /var/lib/jenkins/bluegreen_state
    content: "blue"
    owner: jenkins
    group: jenkins
    mode: '0644'
    force: no  # Don't overwrite if it already exists

- name: Enable and start Jenkins
  systemd:
    name: jenkins
    enabled: yes
    state: restarted

- name: Wait for Jenkins to start
  wait_for:
    port: 8080
    delay: 15
    timeout: 120

- name: Install Nginx as reverse proxy on Jenkins server
  apt:
    name: nginx
    state: present

- name: Deploy Nginx config for Jenkins proxy
  copy:
    dest: /etc/nginx/sites-available/jenkins
    content: |
      server {
          listen 80;
          server_name _;

          location / {
              proxy_pass         http://localhost:8080;
              proxy_set_header   Host $host;
              proxy_set_header   X-Real-IP $remote_addr;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
          }
      }

- name: Enable Jenkins Nginx site
  file:
    src: /etc/nginx/sites-available/jenkins
    dest: /etc/nginx/sites-enabled/jenkins
    state: link

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable and start Nginx
  systemd:
    name: nginx
    enabled: yes
    state: restarted
