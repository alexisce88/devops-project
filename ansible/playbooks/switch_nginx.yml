---
# switch_nginx.yml — Switch Nginx traffic to target_slot (blue or green)
# Called by Jenkins Production Pipeline
# Required extra vars:
#   - target_slot: blue or green
#   - blue_ip, green_ip, staging_ip (server IPs)

- name: Switch Nginx to target production slot
  hosts: jenkins
  become: yes
  vars:
    nginx_server_name: "_"

  tasks:
    - name: Validate target slot
      assert:
        that:
          - target_slot in ['blue', 'green']
        fail_msg: "target_slot must be 'blue' or 'green', got: {{ target_slot }}"

    - name: Disable inactive slot config
      file:
        path: "/etc/nginx/conf.d/{{ item }}.conf"
        state: absent
      loop:
        - blue
        - green

    - name: Deploy active slot Nginx config
      template:
        src: "../roles/nginx/templates/{{ target_slot }}.conf.j2"
        dest: "/etc/nginx/conf.d/active.conf"
        mode: '0644'

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    - name: Confirm traffic switched
      debug:
        msg: "Nginx is now routing traffic to slot: {{ target_slot }}"
