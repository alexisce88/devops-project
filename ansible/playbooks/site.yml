---
# site.yml — Master playbook: provision all 4 servers
# Usage: ansible-playbook playbooks/site.yml
#
# Architecture note: monitoring stack (Prometheus + Grafana + Alertmanager)
# runs on the Jenkins server to stay within the 8 vCPU Free Tier limit.

- name: Configure all servers with common role (Docker + swap)
  hosts: all_servers
  become: yes
  roles:
    - common

- name: Configure Jenkins server (Jenkins + Nginx + Monitoring)
  hosts: jenkins
  become: yes
  vars:
    grafana_admin_password: "admin123"
    jenkins_ip: "{{ inventory_hostname }}"
    staging_ip: "{{ groups['staging'][0] }}"
    blue_ip: "{{ groups['blue'][0] }}"
    green_ip: "{{ groups['green'][0] }}"
    monitoring_ip: "{{ inventory_hostname }}"
  roles:
    - jenkins
    - nginx
    - monitoring
