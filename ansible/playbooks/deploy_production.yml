---
# deploy_production.yml — Deploy app to a blue or green slot
# Called by GitHub Actions production workflow
# Required extra vars: target_slot, frontend_image, backend_image, ghcr_username, ghcr_token, db_password

- name: Deploy application to production slot
  hosts: production
  become: yes
  vars:
    deploy_env: production
    slot_ports:
      blue:
        frontend: 3000
        backend: 3001
      green:
        frontend: 3002
        backend: 3003
    frontend_port: "{{ slot_ports[target_slot].frontend }}"
    backend_port: "{{ slot_ports[target_slot].backend }}"

  roles:
    - app

  post_tasks:
    - name: Wait for backend to be healthy
      uri:
        url: "http://{{ ansible_host }}:{{ backend_port }}/health"
        method: GET
        status_code: 200
      register: health_result
      retries: 18
      delay: 10
      until: health_result.status == 200

    - name: Wait for frontend to be ready
      uri:
        url: "http://{{ ansible_host }}:{{ frontend_port }}"
        method: GET
        status_code: 200
      register: frontend_result
      retries: 18
      delay: 10
      until: frontend_result.status == 200

    - name: Deployment summary
      debug:
        msg: "Slot '{{ target_slot }}' is ready at {{ ansible_host }}"
