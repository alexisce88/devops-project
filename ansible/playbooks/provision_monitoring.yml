---
# provision_monitoring.yml — Provision monitoring server only
# Usage: ansible-playbook playbooks/provision_monitoring.yml

- name: Configure monitoring server
  hosts: monitoring
  become: yes
  vars:
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_PASSWORD') | default('admin123', true) }}"
    jenkins_ip: "{{ hostvars[groups['jenkins'][0]]['ansible_host'] }}"
    staging_ip: "{{ hostvars[groups['staging'][0]]['ansible_host'] }}"
    blue_ip: "{{ hostvars[groups['blue'][0]]['ansible_host'] }}"
    green_ip: "{{ hostvars[groups['green'][0]]['ansible_host'] }}"
    monitoring_ip: "{{ ansible_host }}"
  roles:
    - common
    - monitoring
