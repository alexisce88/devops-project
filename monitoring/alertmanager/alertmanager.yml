global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.resend.com:465'
  smtp_from: 'grafana@zenezia.ro'
  smtp_auth_username: 'resend'
  smtp_auth_password: 'RESEND_API_KEY_PLACEHOLDER'
  smtp_require_tls: false

templates: []

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-warning'

  routes:
    - match:
        severity: critical
      receiver: 'email-critical'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'email-warning'
      repeat_interval: 4h

receivers:
  - name: 'email-critical'
    email_configs:
      - to: 'alexis.cimpu@gmail.com'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .GroupLabels.instance }}'

  - name: 'email-warning'
    email_configs:
      - to: 'alexis.cimpu@gmail.com'
        send_resolved: true
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }} - {{ .GroupLabels.instance }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
