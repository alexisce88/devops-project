global:
  resolve_timeout: 5m

templates: []

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 5m
  receiver: 'jenkins-webhook'

  routes:
    - match:
        severity: critical
        alertname: AppDown
      receiver: 'jenkins-rollback'
      repeat_interval: 5m
      group_wait: 10s

    - match:
        severity: critical
      receiver: 'jenkins-webhook'

    - match:
        severity: warning
      receiver: 'jenkins-webhook'

receivers:
  # Generic Jenkins notification
  - name: 'jenkins-webhook'
    webhook_configs:
      - url: 'http://JENKINS_IP:8080/generic-webhook-trigger/invoke?token=prometheus-alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'admin'
            password: 'JENKINS_API_TOKEN'

  # AppDown → triggers rollback pipeline
  - name: 'jenkins-rollback'
    webhook_configs:
      - url: 'http://JENKINS_IP:8080/job/production-pipeline/buildWithParameters?token=rollback-trigger&ROLLBACK=true'
        send_resolved: false
        http_config:
          basic_auth:
            username: 'admin'
            password: 'JENKINS_API_TOKEN'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
