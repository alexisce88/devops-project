name: Deploy to Staging

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build + push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: app/backend
          push: true
          tags: |
            ghcr.io/alexisce88/devops-backend:${{ github.sha }}
            ghcr.io/alexisce88/devops-backend:latest

  build-frontend:
    name: Build + push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          push: true
          tags: |
            ghcr.io/alexisce88/devops-frontend:${{ github.sha }}
            ghcr.io/alexisce88/devops-frontend:latest

  deploy:
    name: Deploy to staging server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: app/docker-compose.staging.yml
          target: /opt/app
          strip_components: 1

      - name: Login to GHCR on staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stop old containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker compose -f /opt/app/docker-compose.staging.yml down --remove-orphans

      - name: Pull new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_TAG="${{ github.sha }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            docker compose -f /opt/app/docker-compose.staging.yml pull

      - name: Start containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_TAG="${{ github.sha }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            docker compose -f /opt/app/docker-compose.staging.yml up -d

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for backend to be ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 10); do
              if curl -sf http://localhost:3001/health > /dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "Waiting... ($i/10)"
              sleep 3
            done
            echo "Health check failed"
            exit 1

  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: health-check
    environment: PROD
    permissions:
      actions: write

    steps:
      - name: Trigger production pipeline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production.yml',
              ref: 'master',
              inputs: {
                image_tag: '${{ github.sha }}'
              }
            })
