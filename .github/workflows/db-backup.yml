name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Dump PostgreSQL to S3
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Dump database and upload to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FILENAME="backup-${TIMESTAMP}.sql.gz"

          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${{ secrets.STAGING_IP }} \
            "docker run --rm \
              -e PGPASSWORD='${{ secrets.DB_PASSWORD }}' \
              postgres:15 pg_dump \
              -h ${{ secrets.RDS_ENDPOINT }} \
              -U ${{ secrets.DB_USERNAME }} \
              -d appdb" | gzip > "$FILENAME"

          aws s3 cp "$FILENAME" "s3://terraform-s3-tfstate-devops/db-backups/$FILENAME"
          echo "Backup uploaded: db-backups/$FILENAME"