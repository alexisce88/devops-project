name: Deploy to Production (Blue/Green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Blue/Green deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: app/docker-compose.production.yml
          target: /opt/app
          strip_components: 1

      - name: Determine active/idle slots and login to GHCR
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ACTIVE=$(cat /opt/bluegreen_state 2>/dev/null || echo "blue")
            if [ "$ACTIVE" = "blue" ]; then
              IDLE="green"
              IDLE_BACKEND_PORT=3003
            else
              IDLE="blue"
              IDLE_BACKEND_PORT=3001
            fi

            BLUE_TAG=$( [ "$IDLE" = "blue" ] && echo "${{ github.event.inputs.image_tag }}" || echo "latest" )
            GREEN_TAG=$( [ "$IDLE" = "green" ] && echo "${{ github.event.inputs.image_tag }}" || echo "latest" )

            cat > /tmp/bluegreen_env <<EOF
            export ACTIVE=$ACTIVE
            export IDLE=$IDLE
            export IDLE_BACKEND_PORT=$IDLE_BACKEND_PORT
            export BLUE_TAG=$BLUE_TAG
            export GREEN_TAG=$GREEN_TAG
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export RDS_ENDPOINT="${{ secrets.RDS_ENDPOINT }}"
            EOF

            echo "Active slot: $ACTIVE | Deploying to: $IDLE"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new images to idle slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD=$DB_PASSWORD \
            RDS_ENDPOINT=$RDS_ENDPOINT \
            docker compose -f /opt/app/docker-compose.production.yml pull ${IDLE}-frontend ${IDLE}-backend

      - name: Ensure active slot is running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD=$DB_PASSWORD \
            RDS_ENDPOINT=$RDS_ENDPOINT \
            docker compose -f /opt/app/docker-compose.production.yml up -d ${ACTIVE}-frontend ${ACTIVE}-backend

      - name: Start idle slot with new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD=$DB_PASSWORD \
            RDS_ENDPOINT=$RDS_ENDPOINT \
            docker compose -f /opt/app/docker-compose.production.yml up -d ${IDLE}-frontend ${IDLE}-backend

      - name: Smoke test idle slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            echo "Smoke testing $IDLE slot on port $IDLE_BACKEND_PORT..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:${IDLE_BACKEND_PORT}/health > /dev/null; then
                echo "$IDLE slot is healthy"
                exit 0
              fi
              if [ $i -eq 10 ]; then
                echo "Smoke test failed — aborting deploy"
                BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
                DB_PASSWORD=$DB_PASSWORD \
                RDS_ENDPOINT=$RDS_ENDPOINT \
                docker compose -f /opt/app/docker-compose.production.yml stop ${IDLE}-frontend ${IDLE}-backend
                exit 1
              fi
              echo "Waiting... ($i/10)"
              sleep 3
            done

      - name: Switch Nginx to idle slot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            sudo cp /etc/nginx/slots/${IDLE}.conf /etc/nginx/conf.d/active.conf
            sudo nginx -t && sudo nginx -s reload
            echo "Nginx now pointing to $IDLE"

      - name: Monitor for 5 minutes (rollback on failure)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            source /tmp/bluegreen_env
            echo "Monitoring for 5 minutes..."
            DEADLINE=$(($(date +%s) + 300))
            while [ $(date +%s) -lt $DEADLINE ]; do
              if ! curl -sf http://localhost/health > /dev/null; then
                echo "Health check failed — rolling back to $ACTIVE"
                sudo cp /etc/nginx/slots/${ACTIVE}.conf /etc/nginx/conf.d/active.conf
                sudo nginx -t && sudo nginx -s reload
                exit 1
              fi
              sleep 15
            done
            echo "$IDLE" | sudo tee /opt/bluegreen_state
            rm -f /tmp/bluegreen_env
            echo "Deploy complete. Active slot is now: $IDLE"
