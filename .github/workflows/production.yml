name: Deploy to Production (Blue/Green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

jobs:
  snapshot-rds:
    name: Snapshot RDS before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create RDS snapshot
        run: |
          SNAPSHOT_ID="devops-capstone-pre-deploy-${{ github.run_id }}"
          echo "Creating RDS snapshot: $SNAPSHOT_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier devops-capstone-postgres \
            --db-snapshot-identifier "$SNAPSHOT_ID"

      - name: Wait for snapshot to complete
        run: |
          SNAPSHOT_ID="devops-capstone-pre-deploy-${{ github.run_id }}"
          echo "Waiting for snapshot to be available (can take 5-10 min)..."
          aws rds wait db-snapshot-completed \
            --db-snapshot-identifier "$SNAPSHOT_ID"
          echo "Snapshot ready: $SNAPSHOT_ID"

  copy-compose:
    name: Copy docker-compose to server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: app/docker-compose.production.yml
          target: /opt/app
          strip_components: 1

  prepare:
    name: Determine slots + login to GHCR
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.slots.outputs.active }}
      idle: ${{ steps.slots.outputs.idle }}
      idle_backend_port: ${{ steps.slots.outputs.idle_backend_port }}
      blue_tag: ${{ steps.slots.outputs.blue_tag }}
      green_tag: ${{ steps.slots.outputs.green_tag }}
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Resolve slot state
        id: slots
        run: |
          ACTIVE=$(ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ubuntu@${{ secrets.PRODUCTION_IP }} "cat /opt/bluegreen_state 2>/dev/null || echo blue")
          if [ "$ACTIVE" = "blue" ]; then
            IDLE="green"
            IDLE_BACKEND_PORT=3003
          else
            IDLE="blue"
            IDLE_BACKEND_PORT=3001
          fi
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          BLUE_TAG=$( [ "$IDLE" = "blue" ] && echo "$IMAGE_TAG" || echo "latest" )
          GREEN_TAG=$( [ "$IDLE" = "green" ] && echo "$IMAGE_TAG" || echo "latest" )
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT
          echo "idle=$IDLE" >> $GITHUB_OUTPUT
          echo "idle_backend_port=$IDLE_BACKEND_PORT" >> $GITHUB_OUTPUT
          echo "blue_tag=$BLUE_TAG" >> $GITHUB_OUTPUT
          echo "green_tag=$GREEN_TAG" >> $GITHUB_OUTPUT
          echo "Active: $ACTIVE | Deploying to: $IDLE"

      - name: Login to GHCR on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

  pull-images:
    name: Pull new images to idle slot
    runs-on: ubuntu-latest
    needs: [copy-compose, prepare, snapshot-rds]
    steps:
      - name: Pull images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IDLE="${{ needs.prepare.outputs.idle }}"
            BLUE_TAG="${{ needs.prepare.outputs.blue_tag }}"
            GREEN_TAG="${{ needs.prepare.outputs.green_tag }}"
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            RDS_ENDPOINT="${{ secrets.RDS_ENDPOINT }}" \
            docker compose -f /opt/app/docker-compose.production.yml pull ${IDLE}-frontend ${IDLE}-backend

  start-slots:
    name: Start active + idle slots
    runs-on: ubuntu-latest
    needs: [prepare, pull-images]
    steps:
      - name: Ensure active slot is running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ACTIVE="${{ needs.prepare.outputs.active }}"
            BLUE_TAG="${{ needs.prepare.outputs.blue_tag }}"
            GREEN_TAG="${{ needs.prepare.outputs.green_tag }}"
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            RDS_ENDPOINT="${{ secrets.RDS_ENDPOINT }}" \
            docker compose -f /opt/app/docker-compose.production.yml up -d ${ACTIVE}-frontend ${ACTIVE}-backend

      - name: Start idle slot with new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IDLE="${{ needs.prepare.outputs.idle }}"
            BLUE_TAG="${{ needs.prepare.outputs.blue_tag }}"
            GREEN_TAG="${{ needs.prepare.outputs.green_tag }}"
            BLUE_TAG=$BLUE_TAG GREEN_TAG=$GREEN_TAG \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            RDS_ENDPOINT="${{ secrets.RDS_ENDPOINT }}" \
            docker compose -f /opt/app/docker-compose.production.yml up -d ${IDLE}-frontend ${IDLE}-backend

  smoke-test:
    name: Smoke test idle slot
    runs-on: ubuntu-latest
    needs: [prepare, start-slots]
    steps:
      - name: Test idle slot health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IDLE="${{ needs.prepare.outputs.idle }}"
            IDLE_BACKEND_PORT="${{ needs.prepare.outputs.idle_backend_port }}"
            echo "Smoke testing $IDLE slot on port $IDLE_BACKEND_PORT..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:${IDLE_BACKEND_PORT}/health > /dev/null; then
                echo "$IDLE slot is healthy"
                exit 0
              fi
              if [ $i -eq 10 ]; then
                echo "Smoke test failed — aborting deploy"
                BLUE_TAG="${{ needs.prepare.outputs.blue_tag }}" \
                GREEN_TAG="${{ needs.prepare.outputs.green_tag }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                RDS_ENDPOINT="${{ secrets.RDS_ENDPOINT }}" \
                docker compose -f /opt/app/docker-compose.production.yml stop ${IDLE}-frontend ${IDLE}-backend
                exit 1
              fi
              echo "Waiting... ($i/10)"
              sleep 3
            done

  switch-nginx:
    name: Switch Nginx to idle slot
    runs-on: ubuntu-latest
    needs: [prepare, smoke-test]
    steps:
      - name: Update Nginx active config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IDLE="${{ needs.prepare.outputs.idle }}"
            sudo cp /etc/nginx/slots/${IDLE}.conf /etc/nginx/conf.d/active.conf
            sudo nginx -t && sudo nginx -s reload
            echo "Nginx now pointing to $IDLE"

  monitor:
    name: Monitor + rollback or confirm
    runs-on: ubuntu-latest
    needs: [prepare, switch-nginx]
    steps:
      - name: Monitor for 5 minutes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            ACTIVE="${{ needs.prepare.outputs.active }}"
            IDLE="${{ needs.prepare.outputs.idle }}"
            echo "Monitoring for 5 minutes..."
            DEADLINE=$(($(date +%s) + 300))
            while [ $(date +%s) -lt $DEADLINE ]; do
              if ! curl -sf http://localhost/health > /dev/null; then
                echo "Health check failed — rolling back to $ACTIVE"
                sudo cp /etc/nginx/slots/${ACTIVE}.conf /etc/nginx/conf.d/active.conf
                sudo nginx -t && sudo nginx -s reload
                exit 1
              fi
              sleep 15
            done
            echo "$IDLE" | sudo tee /opt/bluegreen_state
            rm -f /tmp/bluegreen_env
            echo "Deploy complete. Active slot is now: $IDLE"
