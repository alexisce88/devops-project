name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test-backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install dependencies
        working-directory: app/backend
        run: npm ci

      - name: Lint
        working-directory: app/backend
        run: npm run lint

      - name: Test
        working-directory: app/backend
        run: npm test

  test-frontend:
    name: Frontend — lint + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint
        working-directory: app/frontend
        run: npm run lint

      - name: Test
        working-directory: app/frontend
        run: npm test

  auto-merge:
    name: Auto-merge to master
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: success()
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge PR and trigger staging
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'merge'
            })
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'staging.yml',
              ref: 'master'
            })

  notify-failure:
    name: Notify PR on failure
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: failure()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ CI failed — lint or tests are broken. Please fix before merging.'
            })