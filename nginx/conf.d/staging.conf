# staging.conf — Routes traffic to the Staging environment
# Accessible on port 8081 of the Jenkins/Nginx server

upstream staging_frontend {
    server STAGING_IP:3000;
}

upstream staging_backend {
    server STAGING_IP:3001;
}

server {
    listen 8081;
    server_name _;

    access_log /var/log/nginx/staging_access.log;
    error_log  /var/log/nginx/staging_error.log;

    location /api/ {
        proxy_pass         http://staging_backend/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass         http://staging_backend/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        proxy_pass         http://staging_frontend/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
