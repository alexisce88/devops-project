# green.conf — Routes traffic to the Green production slot
# Managed by Ansible switch_nginx.yml playbook

upstream green_frontend {
    server GREEN_IP:3000;
}

upstream green_backend {
    server GREEN_IP:3001;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/production_access.log;
    error_log  /var/log/nginx/production_error.log;

    location /api/ {
        proxy_pass         http://green_backend/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /health {
        proxy_pass         http://green_backend/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        proxy_pass         http://green_frontend/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
